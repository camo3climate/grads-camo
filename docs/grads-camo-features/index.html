<!doctype html>
<html lang="ja" id="top">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GrADS CAMO Feature Guide</title>
<meta name="description" content="GrADS CAMO feature guide in Japanese and English.">
<style>
:root{
  --bg:#f3f6f3; --paper:#fff; --ink:#172019; --muted:#657068;
  --green:#245d3c; --green-dark:#163b27; --green-soft:#e7f0e9;
  --blue-soft:#edf3f7; --amber-soft:#f7f1e6; --grey-soft:#f1f2f1;
  --line:#d8e0d9; --code:#111612; --codeink:#eaf3eb;
  --shadow:0 10px 30px rgba(26,45,31,.075);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP","Segoe UI",Arial,sans-serif;
  line-height:1.78;
}
a{color:var(--green);text-decoration-thickness:1px;text-underline-offset:3px}
.hero{background:linear-gradient(135deg,#123522,#285f40 65%,#47795a);color:#fff;padding:70px 24px 62px}
.hero-inner{max-width:1160px;margin:auto}
.eyebrow{font-size:.88rem;letter-spacing:.09em;text-transform:uppercase;opacity:.8}
h1{font-size:clamp(2.05rem,5vw,4.25rem);line-height:1.08;margin:.3em 0 .25em}
.hero p{max-width:900px;font-size:1.08rem;opacity:.93}
.badges,.quicklinks{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}
.badge,.quicklinks a{border:1px solid rgba(255,255,255,.36);border-radius:999px;padding:6px 11px}
.quicklinks a{color:#fff;text-decoration:none;background:rgba(255,255,255,.06)}
.layout{max-width:1260px;margin:0 auto;display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;padding:32px 20px 78px}
.toc{position:sticky;top:18px;align-self:start;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 36px);overflow:auto}
.toc h2{font-size:1rem;margin:4px 7px 10px}
.toc .group-label{font-size:.77rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 8px 4px}
.toc a{display:block;padding:7px 8px;border-radius:9px;text-decoration:none;color:var(--ink);font-size:.91rem}
.toc a:hover{background:var(--green-soft)}
main{min-width:0}
.intro,.group,.refs{background:var(--paper);border:1px solid var(--line);border-radius:19px;padding:clamp(20px,3vw,38px);box-shadow:var(--shadow);margin-bottom:24px}
.intro h2,.refs h2{margin-top:0}
.group{scroll-margin-top:18px}
.group-head{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:26px}
.group-kicker{display:inline-block;font-weight:800;color:var(--green);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px}
.group h2{font-size:clamp(1.75rem,3vw,2.55rem);line-height:1.25;margin:.1em 0 .35em}
.group-summary{font-size:1.06rem;color:#3e4b42;max-width:920px;margin:0}
.overview{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:22px 0 6px}
.overview a{display:block;background:#f8faf8;border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:var(--ink)}
.overview a:hover{border-color:#b8cabd;background:var(--green-soft)}
.overview strong{display:block;font-size:1.05rem;margin-bottom:5px}
.overview span{font-size:.9rem;color:var(--muted)}
.feature{padding:26px 0;border-top:1px solid var(--line)}
.feature:first-of-type{border-top:0;padding-top:0}
.feature-title-row{display:flex;gap:13px;align-items:flex-start}
.xbadge{flex:none;display:inline-block;border:1px solid #cbd7cd;background:#f4f8f5;border-radius:999px;padding:3px 8px;font-size:.74rem;font-weight:750;color:#476250;white-space:nowrap;margin-top:5px}
.feature h3{font-size:clamp(1.28rem,2.2vw,1.75rem);line-height:1.35;margin:0 0 .35em}
.lead{margin-top:0;color:#435048;font-size:1.02rem}
.gallery{display:grid;gap:15px;margin:18px 0}
.gallery.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.gallery.one{grid-template-columns:minmax(0,1fr)}
figure{margin:0;border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#080808}
figure img{display:block;width:100%;height:auto}
figcaption{padding:9px 12px;background:#f7f9f7;color:#4e5952;font-size:.88rem;border-top:1px solid var(--line)}
pre{background:var(--code);color:var(--codeink);padding:15px 17px;border-radius:12px;overflow:auto;line-height:1.55;font-size:.93rem;border:1px solid #29362c}
code{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
p code,li code{background:#eef2ee;padding:.1em .32em;border-radius:5px;color:#263529}
.callout{border-left:4px solid var(--green);padding:12px 16px;background:#f3f7f4;border-radius:8px;margin:18px 0}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 2px}
.links a{display:inline-block;border:1px solid #ccd9cf;border-radius:999px;padding:6px 11px;text-decoration:none;background:var(--green-soft);font-size:.9rem;font-weight:650}
.group.display{border-top:6px solid #315f46}
.group.geo{border-top:6px solid #496c82}
.group.analysis{border-top:6px solid #92733b}
.group.env{border-top:6px solid #666b68}
.group.display .group-kicker{color:#315f46}
.group.geo .group-kicker{color:#496c82}
.group.analysis .group-kicker{color:#92733b}
.group.env .group-kicker{color:#666b68}
.refs ul{padding-left:1.2rem}
.refs li{margin:.35em 0}
footer{max-width:1260px;margin:0 auto;padding:0 20px 50px;color:var(--muted);font-size:.9rem}
.toplink{text-align:right;margin-top:14px}
.toplink a{font-size:.88rem}
.small{font-size:.9rem;color:var(--muted)}
@media(max-width:980px){
  .layout{grid-template-columns:1fr}
  .toc{position:relative;top:auto;max-height:none}
  .overview{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:700px){
  .gallery.two,.overview{grid-template-columns:1fr}
  .hero{padding-top:46px}
  .feature-title-row{display:block}
  .xbadge{margin:0 0 7px}
}
</style>
</head>
<body>
<header class="hero">
<div class="hero-inner">
<div class="eyebrow">GrADS CAMO</div>
<h1>GrADS CAMO Feature Guide</h1>
<p>GrADS CAMOの機能を「表示・デザイン」「地理描画」「解析・出力」「動作環境・互換性」の4グループで紹介します。Choose Japanese or English.</p>
<div class="quicklinks">
<a href="ja/">日本語</a><a href="en/">English</a>
<a href="https://github.com/camo3climate/grads-camo">GitHub</a><a href="https://camo.fpark.tmu.ac.jp/grads-reference-ja.html">GrADS Reference</a><a href="https://camo.fpark.tmu.ac.jp/">CAMO</a>
</div>
</div>
</header>
</body>
</html>
